<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!--
  Source template for the share cards in source/assets/images/og/.
  Rendered to 1200x630 PNGs with headless Chrome; see the `og:` note in
  README or regenerate with the same command used when these were built.
  Params: k = kicker, t = title (wrap a phrase in *asterisks* for italics),
          m = right-hand meta line.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@400;500&display=swap">
<style>
@font-face {
    font-family: '0xProto';
    src: url('/assets/fonts/0xProto-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
}

:root {
    --ink: #111111;
    --ink-3: #6e6e6e;
    --ink-4: #9a9a9a;
    --rule: #e0e0e0;
    --paper: #fbfbfa;
    --mono: '0xProto', ui-monospace, monospace;
    --display: 'Newsreader', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { width: 1200px; height: 630px; }

body {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 66px 72px;
    background-color: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
}

.row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 19px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-4);
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--ink);
}

.dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: var(--ink);
}

.top { padding-bottom: 26px; border-bottom: 1px solid var(--rule); }
.bottom { padding-top: 26px; border-top: 1px solid var(--rule); }

h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 82px;
    line-height: 1.14;
    letter-spacing: -0.02em;
    max-width: 15ch;
}

h1 em { font-style: italic; color: var(--ink-3); }

h1.long { font-size: 66px; max-width: 18ch; }
</style>
</head>
<body>
<div class="row top">
    <span class="brand"><span class="dot"></span> <span id="kicker">Nuruzzaman Milon</span></span>
    <span id="section"></span>
</div>

<h1 id="title"></h1>

<div class="row bottom">
    <span>milon.im</span>
    <span id="meta">Engineering Tech Lead · Vancouver, BC</span>
</div>

<script>
var q = new URLSearchParams(location.search);
var title = q.get('t') || 'Building software that scales *to millions of users.*';
var el = document.getElementById('title');

// *phrase* marks the italic emphasis used across the site's headings.
el.innerHTML = title
    .replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; })
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');

if (el.textContent.length > 42) el.classList.add('long');

if (q.get('k')) document.getElementById('kicker').textContent = q.get('k');
if (q.get('s')) document.getElementById('section').textContent = q.get('s');
if (q.get('m')) document.getElementById('meta').textContent = q.get('m');
</script>
</body>
</html>
