name: Build & Publish

on:
  push:
    branches:
      - develop
  schedule:
    # Midnight UTC every day — refreshes open-source stats baked in at build time.
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup PHP 8.5
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.5
        tools: composer:v2
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-interaction --no-progress
    - name: Install Dependencies
      run: bun install --frozen-lockfile
    - name: Build assets
      run: bun run build
    - name: Build Jigsaw site
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./vendor/bin/jigsaw build production
    - name: Create CNAME and disable Jekyll
      run: |
        echo "milon.im" > build_production/CNAME
        touch build_production/.nojekyll
    - name: Stage Files
      run: git add -f build_production
    - name: Commit files
      id: commit
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        if git diff --staged --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "No build changes to commit."
        else
          git commit -m "Build for deploy"
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Publish
      if: steps.commit.outputs.changed == 'true'
      run: |
        git subtree split --prefix build_production -b master
        git push -f origin master:master
        git branch -D master
